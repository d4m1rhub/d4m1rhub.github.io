<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❖ D4M1R_HUB ❖</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-color: #121216;
            --accent-color: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.3);
            --text-color: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            background: linear-gradient(0deg, rgba(0, 255, 102, 0.1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 255, 102, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px 20px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 10px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        main {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            flex: 1;
        }

        .card {
            background-color: var(--panel-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border 0.3s ease;
        }

        .card:hover {
            border-color: rgba(0, 255, 102, 0.3);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
        }

        .status-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #334155;
        }

        .status-name {
            font-weight: 500;
        }

        .status-badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .status-online {
            background-color: rgba(0, 255, 102, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            text-align: center;
            padding: 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
            margin-bottom: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 102, 0.5);
            background-color: #00e65c;
        }

        .btn-secondary {
            background-color: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <div class="matrix-bg"></div>

    <header>
        <div class="logo">❖ <span>D4M1R_HUB</span> ❖</div>
        <div class="subtitle">Next-Gen Exploit Center</div>
    </header>

    <main>
        <!-- Links / Action -->
        <div class="card">
            <div class="card-title">Quick Access</div>
            <a href="https://discord.gg/DEIN-LINK" target="_blank" class="btn">⚡ JOIN DISCORD SERVER</a>
            <a href="#downloads" class="btn btn-secondary">📥 Browse Exploits</a>
        </div>

        <!-- Status Panel -->
        <div class="card">
            <div class="card-title">Live Exploit Status</div>
            <div class="status-grid">
                <div class="status-item" style="border-left-color: var(--accent-color);">
                    <span class="status-name">Exploit Menu V1</span>
                    <span class="status-badge status-online">Undetected</span>
                </div>
                <div class="status-item" style="border-left-color: var(--accent-color);">
                    <span class="status-name">Game Tweak Tools</span>
                    <span class="status-badge status-online">Undetected</span>
                </div>
                <div class="status-item" style="border-left-color: var(--accent-color);">
                    <span class="status-name">Injector Bypass</span>
                    <span class="status-badge status-online">Working</span>
                </div>
                <div class="status-item" style="border-left-color: var(--accent-color);">
                    <span class="status-name">Scripts & Macros</span>
                    <span class="status-badge status-online">Safe</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 ❖ D4M1R_HUB ❖. All rights reserved. Built for raw performance.
    </footer>

</body>
</html>
